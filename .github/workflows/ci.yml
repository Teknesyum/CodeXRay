name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
  workflow_dispatch:
    inputs:
      clarification_measurement:
        description: Repeat the clarification pipeline ten times instead of the full browser gate
        required: false
        type: boolean
        default: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    env:
      CODEXRAY_E2E_WORKERS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run browser gate
        if: ${{ !inputs.clarification_measurement }}
        run: npm run test:e2e
      - name: Measure clarification pipeline
        if: ${{ inputs.clarification_measurement }}
        run: npx playwright test e2e/titan-mode-clarification.spec.ts --grep "asks for missing" --repeat-each=10 --workers=1
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run desktop:check
      - run: npm run desktop:build
