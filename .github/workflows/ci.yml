name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    env:
      CODEXRAY_E2E_WORKERS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: error
          retention-days: 7

  browser-diagnosis:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        mode: [parallel-full, isolated-implicated]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run current parallel configuration
        if: matrix.mode == 'parallel-full'
        run: npm run test:e2e
      - name: Run implicated specs in isolation
        if: matrix.mode == 'isolated-implicated'
        shell: bash
        run: |
          status=0
          for spec in \
            e2e/dp-family-titan-mode.spec.ts \
            e2e/usage-scenarios.spec.ts \
            e2e/titan-mode-user-graph.spec.ts \
            e2e/titan-mode-clarification.spec.ts \
            e2e/release-tour.spec.ts \
            e2e/interval-dp-titan-mode.spec.ts
          do
            echo "::group::$spec"
            npx playwright test "$spec" || status=1
            echo "::endgroup::"
          done
          exit "$status"
      - name: Upload diagnosis artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnosis-${{ matrix.mode }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: error
          retention-days: 7

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run desktop:check
      - run: npm run desktop:build
