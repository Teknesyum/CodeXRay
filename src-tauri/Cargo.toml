[package]
name = "codexray"
version = "2.3.3"
description = "Deterministic algorithm visualization with optional local AI"
authors = ["Serkan Ozel"]
edition = "2021"

[lib]
name = "codexray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["macros", "sync", "time"] }
tokio-util = "0.7"
url = "2"
